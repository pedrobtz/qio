name: Profile read_parquet

on:
  workflow_dispatch:
    inputs:
      frequency:
        description: 'Sampling frequency in Hz'
        default: '100'
        required: false
        type: string
      iterations:
        description: 'Number of read_parquet iterations'
        default: '3'
        required: false
        type: string
      retention_days:
        description: 'Days to keep the Rprof.out artifact (1 is the minimum)'
        default: '1'
        required: false
        type: string

jobs:
  profile:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev libunwind-dev libcap2-bin

      - name: Build and install xrprof
        run: |
          git clone --depth=1 https://github.com/atheriel/xrprof /tmp/xrprof-src
          make -C /tmp/xrprof-src
          sudo make -C /tmp/xrprof-src install

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install qio
        run: R CMD INSTALL .

      - name: Download NYC yellow taxi data
        run: |
          mkdir -p .cache
          curl -fsSL --retry 3 --max-time 300 \
            "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2023-01.parquet" \
            -o .cache/yellow_tripdata_2023-01.parquet
          ls -lh .cache/yellow_tripdata_2023-01.parquet

      - name: Profile
        run: |
          FREQ="${{ inputs.frequency || '100' }}"
          ITER="${{ inputs.iterations || '3' }}"

          cat > /tmp/bench.R << 'REOF'
          library(qio)
          n <- as.integer(Sys.getenv("QIO_ITER", "3"))
          message("qio::read_parquet x", n, " iteration(s)")
          for (i in seq_len(n)) {
            qio::read_parquet(".cache/yellow_tripdata_2023-01.parquet")
          }
          message("done")
          REOF

          # Launch R in background; xrprof attaches to it by PID
          QIO_ITER="$ITER" Rscript /tmp/bench.R &
          RPID=$!

          # Give R a moment to start before attaching
          sleep 1

          # Profile until the R process exits; output is Rprof.out format
          xrprof -p "$RPID" -F "$FREQ" > /tmp/Rprof.out || true

          wait "$RPID"

          echo "=== Profile (Rprof.out, first 5 lines) ==="
          head -5 /tmp/Rprof.out

          echo ""
          echo "=== summaryRprof ==="
          Rscript -e "
            p <- summaryRprof('/tmp/Rprof.out')
            cat('\n--- by self time ---\n')
            print(head(p\$by.self, 30))
            cat('\n--- by total time ---\n')
            print(head(p\$by.total, 30))
            cat('\nsampling time:', p\$sampling.time, 's\n')
          "

      - name: Upload Rprof.out
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rprof-out-${{ github.run_id }}
          path: /tmp/Rprof.out
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days || '1' }}
          compression-level: 9
