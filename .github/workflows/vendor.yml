# Guards the vendored foundation: src/carquet must be exactly the pinned
# upstream commit plus .agents/carquet-changes.patch, and a change to a shared
# vendored header must rebuild every object.
#
# See .agents/VENDORED.md for the pin and the patch ledger, and
# .agents/plan.md phase 1 for why these are release gates.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: vendor

permissions: read-all

jobs:
  patch-drift:
    runs-on: ubuntu-latest
    name: carquet patch drift
    steps:
      - uses: actions/checkout@v4

      # Reverse-applies the patch record to src/carquet and compares the
      # result with pristine upstream at the pin. Fails if a vendored file was
      # edited without updating the patch, or if the patch went stale.
      - name: Check vendored tree against the pin
        run: ./tools/check-vendor-drift.sh

  header-deps:
    runs-on: ubuntu-latest
    name: vendored header dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Needs no package dependencies: the check only runs R CMD INSTALL.
      - name: Check that a header change rebuilds every object
        run: ./tools/check-header-deps.sh
