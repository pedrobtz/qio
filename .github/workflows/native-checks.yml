on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: native-checks

# The reusable workflows declare `permissions: read-all`; a called workflow
# cannot request more than the caller grants, so grant read-all here. (Repos
# with a restricted default GITHUB_TOKEN need this explicitly.)
permissions: read-all

# Every job here finishes inside six minutes, so this workflow is the fast
# native signal and runs on every push to the default branch. gctorture is
# deliberately not part of it: it takes about nine times as long as all four of
# these combined, and gating them behind it would delay the answers that
# arrive quickly. See .github/workflows/gctorture.yml.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@main

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@main

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@main

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@main
