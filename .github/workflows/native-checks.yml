on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: native-checks

# A called workflow cannot be granted more than its caller holds, so grant
# read-all here; the reusable workflows ask for no more than `contents: read`.
permissions: read-all

# A push to a pull request supersedes the run for the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job here finishes in minutes, so this workflow is the fast
# native signal and runs on every push to the default branch and every pull
# request. gctorture is deliberately not part of it: it takes about nine times
# as long as all of these combined, and gating them behind it would delay the
# answers that arrive quickly. See .github/workflows/gctorture.yml.
#
# Quick on each push to a pull request, full on the push to main: `profile:
# quick` drops the ASan containers and Valgrind, and keeps both UBSan legs.
# Label a pull request `full-ci` to run the full set before merging -- worth it
# for anything that changes how memory is allocated or freed, which UBSan does
# not see. lto and rchk take minutes either way and always run.
#
# Pinned to the r-actions major tag rather than `main`, so a breaking change
# upstream arrives as a deliberate bump here instead of a red run.
jobs:
  # UBSan as CRAN runs it: one clang leg (clang-UBSAN) and one gcc leg with
  # `bounds-strict` (gcc-UBSAN), each report collected from every process and
  # the job failing on any. The gcc leg is the one that sees the pre-C99
  # struct hack, `T items[1]` indexed past its end, which clang treats as a
  # flexible array and never checks -- worth having over three vendored trees.
  #
  # `asan: true` adds CRAN's clang-ASAN and gcc-ASAN flavors in the R-hub
  # containers, whose R is already built to host an instrumented package.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
