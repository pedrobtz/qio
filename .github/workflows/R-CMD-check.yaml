on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "17 12 * * 6"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A push to a pull request supersedes the run for the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `--as-cran` on GitHub's runners and in the CRAN-like containers (clang23,
# ubuntu-clang, ubuntu-gcc16), where CRAN's `-pedantic` and newer-compiler
# findings show up first. The containers are R-devel on Linux, so the
# ubuntu-latest R-devel row the hand-rolled matrix carried is gone.
#
# Quick on pull requests (one Linux R-release leg and clang23), full on the
# schedule, on a dispatch and on a pull request labelled `full-ci`.
jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      # The default runners plus Windows R-devel. Windows R-devel is here
      # rather than left to a win-builder submission before a release. qio has
      # Windows-only code paths -- the code-page path handling with its mmap
      # fallback, and the per-thread zstd context that only ever broke there
      # -- so a toolchain or R change that affects them should surface on the
      # commit that causes it, not once at tagging time.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
      # CRAN's NOSUGGESTS flavor, in the R-hub image with only hard
      # dependencies installed. Every other leg installs bit64, hms, dplyr and
      # withr, so none of them can prove qio's claim of no required
      # dependencies -- and the first noSuggests run found a real ERROR: an
      # `int64 = "integer64"` read in a verbose-output test with no
      # `skip_if_not_installed("bit64")`.
      nosuggests: true
