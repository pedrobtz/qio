on:
  push:
    branches: [main, master]
    # gctorture exists to find PROTECT bugs, and a PROTECT bug is introduced by
    # C code, not by R code or tests. Running it only when compiled sources
    # change keeps it off the ~95% of commits it cannot say anything new about.
    #
    # `src/**` covers the vendored trees as well as package-owned glue, which is
    # intended: re-vendoring changes what the glue calls into.
    paths:
      - "src/**"
      - ".github/workflows/gctorture.yml"
  # The same filter on pull requests, and `labeled` so that adding `full-ci`
  # reruns it at the sensitive step.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src/**"
      - ".github/workflows/gctorture.yml"
  workflow_dispatch:

name: gctorture

permissions: read-all

# Two pushes in quick succession would otherwise run this to completion twice,
# for the better part of two hours of runner time, to answer the same question.
concurrency:
  group: gctorture-${{ github.ref }}
  cancel-in-progress: true

# Split out of native-checks because of what it costs. Measured across three
# green runs, gctorture took 41, 50, and 53 minutes while sanitizers, Valgrind,
# LTO, and rchk each finished in two to six. Since the five ran in parallel in
# one workflow, gctorture alone set the wall clock, and a red X on the workflow
# meant waiting an hour to learn which job produced it.
#
# The cost also grows with the suite: about five seconds per added assertion,
# against the reusable workflow's `timeout-minutes` input, 120 by default. The
# job would fail *as a timeout* -- which reads like an infrastructure flake
# rather than the real signal it is -- so raise that input here before the
# suite reaches it.
#
# `profile: quick` runs at step 500 instead of 20, a few minutes instead of
# most of an hour, so a pull request that changes C gets an answer while it is
# open; the push to main, a `full-ci` label, or a dispatch runs at step 20.
#
# Tests are deliberately not in the path filter. A test can reveal a PROTECT
# bug but cannot introduce one, so new coverage over unchanged C is caught by
# the release-time dispatch rather than by every push.
#
# Pinned to the r-actions major tag rather than `main`, like native-checks.
jobs:
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
