on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "27 12 * * 6"
  pull_request:
  workflow_dispatch:

name: coverage.yaml

# The reusable workflow commits the rendered badge to .github/badges on push,
# so it needs write access to contents; a called workflow cannot request more
# than the caller grants. Pull requests still compute coverage and write the
# job summary, but skip the commit.
permissions:
  contents: write

jobs:
  coverage:
    # Pinned to a commit, not `@v1`, because this is the one call that holds a
    # write token: a moved tag cannot change what runs with it.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1.18.0
    permissions:
      contents: write
