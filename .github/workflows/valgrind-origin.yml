# TEMPORARY diagnostic: pinpoint the x86 DOUBLE-decode corruption by running a
# minimal double-only write->read reproducer under valgrind --track-origins,
# which names the allocation/function that produced the uninitialised values.
# Remove once the bug is fixed.
on:
  workflow_dispatch:
  pull_request:

name: valgrind-origin

permissions: read-all

jobs:
  track-origins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install qio
        run: R CMD INSTALL .

      - name: Write reproducer
        run: |
          cat > /tmp/repro.R <<'REOF'
          library(qio)
          n <- 300L
          df <- data.frame(dense = as.double(seq_len(n) %% 8L))  # double-only, no nulls
          p <- tempfile(fileext = ".parquet")
          write_parquet(df, p)
          x <- collect(parquet_open(p), batch_size = 7L)
          cat("mismatch rows:", sum(x$dense != df$dense), "\n")
          REOF

      - name: Run under valgrind --track-origins
        run: |
          R --vanilla -d "valgrind --track-origins=yes --num-callers=30 --error-exitcode=0" \
            -f /tmp/repro.R > /tmp/vg.log 2>&1 || true
          echo "===== uninitialised-value origins (carquet/qio frames) ====="
          grep -nE "Uninitialised value was created|Use of uninitialised|Conditional jump|by 0x.*(carquet|qio|_decode|gather|bitunpack|rle|plain|page_reader|column_reader)" /tmp/vg.log | head -60 || true
          echo "===== raw tail ====="
          tail -80 /tmp/vg.log
